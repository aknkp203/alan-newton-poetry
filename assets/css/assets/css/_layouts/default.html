<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <meta name="description" content="{{ site.description }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

</head>

<body>

<header>

<div class="wrapper">

<h1>
<a href="{{ '/' | relative_url }}">
Alan Newton
</a>
</h1>

<p class="tagline">
Poet • Traveler • Observer
</p>

<nav>

<a href="{{ '/' | relative_url }}">Home</a>

<a href="{{ '/poems/' | relative_url }}">Poems</a>

<a href="{{ '/books/' | relative_url }}">Books</a>

<a href="{{ '/about/' | relative_url }}">About</a>

<a href="{{ '/contact/' | relative_url }}">Contact</a>

</nav>

</div>

</header>

<main class="wrapper">

{{ content }}

</main>

<footer>

<div class="wrapper">

<p>

© {{ site.time | date: "%Y" }}

Alan Newton

</p>

</div>

</footer>

</body>

</html>
